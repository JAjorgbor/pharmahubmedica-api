openapi: 3.0.3
info:
  title: Users API (fragment)
  version: "1.0.0"
tags:
  - name: Users
    description: Operations related to users
paths:
  /users/adfa/{id}:
    get:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the user to retrieve
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
