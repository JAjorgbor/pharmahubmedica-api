[build]
  command = "pnpm build"
  functions = "dist/netlify/functions"


[[redirects]]
  from = "/v2/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[functions]
  included_files = []
  node_bundler = "esbuild"
  external_node_modules = ["express", "jsdom"]

[functions."*"]
  ignored_files = ["**/*.d.ts", "**/*.d.ts.map"]